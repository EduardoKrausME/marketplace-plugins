name: Build MCP Marketplace screenshots (one-time)

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/generate-mcp-screenshots-once.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: marketplace-mcp-screenshots-master
  cancel-in-progress: false

jobs:
  screenshots:
    name: Render and validate four screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install renderer dependency
        run: python3 -m pip install --quiet --disable-pip-version-check pillow

      - name: Render 1600x900 screenshots
        shell: bash
        run: |
          printf '%s' '' | base64 -d | gzip -d > /tmp/render_mcp_marketplace_screens.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('/tmp/render_mcp_marketplace_screens.py')
          source = path.read_text()
          fixes = [
              ('Give each course user a secure, personal ChatGPT connection.',
               'A personal ChatGPT connection for authorized teachers and course managers.'),
              ("('Personal connection','Each person authorizes their own Moodle account.'),",
               "('Personal connection','Each teacher uses their own Moodle account.'),"),
              ("('Study content','Reach visible course content, tasks and grades.'),",
               "('Teaching tools','Consult course content and organize teaching tasks.'),"),
              ("('Course permissions','Respect enrolment and the user\\'s Moodle role.'),",
               "('Teacher permissions','Students cannot see or access the MCP block.'),"),
              ("('Audience controls','Allow teachers or teachers and students.'),",
               "('Teachers only','The block is restricted to teaching staff and managers.'),"),
              ("'BIOLOGY 101  /  STUDENT VIEW','Your AI study assistant'",
               "'BIOLOGY 101  /  TEACHER VIEW','Your AI course assistant'"),
              ("'Study the visible course content and check your own progress, deadlines and grades in ChatGPT.'",
               "'Consult your course content and organize teaching activities in ChatGPT.'"),
              ("'Configure the block audience and optional, permission-scoped write access.'",
               "'Manage optional, permission-scoped write access for teaching staff.'"),
          ]
          for before, after in fixes:
              if source.count(before) != 1:
                  raise RuntimeError('Expected exactly one occurrence: ' + before)
              source = source.replace(before, after)
          start_marker = "    txt(d,613,279,'Who can connect',20,NAVY,'semibold')"
          end_marker = "    button(d,(1201,765,1468,808),'Save changes',True,20)"
          if source.count(start_marker) != 1 or source.count(end_marker) != 1:
              raise RuntimeError('Could not locate obsolete audience dropdown')
          start = source.index(start_marker)
          end = source.index(end_marker, start)
          replacement = """    txt(d,613,283,'Teacher-only course access',21,NAVY,'semibold')
              para(d,613,323,'The MCP block is available to authorized teachers and course managers. Students cannot see the block or access its tools.',18,MUTED,820,27)
              stroke_line(d,(614,410),(1459,410),LINE,2)
              rounded(d,(615,450,648,483),'#FFFFFF',7,'#9FB5D2',3)
              txt(d,666,449,'Allow teacher WRITE tools',21,NAVY,'semibold')
              txt(d,666,485,'Disabled by default; users also need block/mcp:write.',18,MUTED)
              rounded(d,(613,547,1463,707),'#F1F6FD',14,'#D7E4F4',2)
              info_icon(d,634,564,'i')
              txt(d,680,562,'About teacher WRITE tools',19,NAVY,'semibold')
              para(d,680,598,'Only selected, course-scoped WRITE tools can be enabled for authorized teachers. The ChatGPT user must still confirm supported changes before execution. Site administration tools are never available through this block.',18,MUTED,736,29)
          """
          source = source[:start] + replacement + source[end:]
          assert 'STUDENT VIEW' not in source
          assert 'Teachers and students' not in source
          path.write_text(source)
          PY
          python3 /tmp/render_mcp_marketplace_screens.py . .

      - name: Validate output and distinct flows
        run: |
          python3 <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib
          hashes = set()
          for component in ('mod_mcp', 'block_mcp'):
              for number in (1, 2):
                  path = Path('screenshots') / component / f'new-{number}.png'
                  assert path.is_file(), f'{path}: missing'
                  with Image.open(path) as img:
                      assert img.format == 'PNG', f'{path}: must be PNG'
                      assert img.size == (1600, 900), f'{path}: must be 16:9'
                      assert img.mode == 'RGB', f'{path}: expected RGB'
                      assert img.getpixel((100, 80)) != img.getpixel((10, 10)), f'{path}: plugin icon missing'
                  sha = hashlib.sha256(path.read_bytes()).hexdigest()
                  assert sha not in hashes, f'{path}: duplicate screenshot'
                  hashes.add(sha)
                  print(f'{path}: validated ({path.stat().st_size} bytes, sha256 {sha[:12]})')
          assert len(hashes) == 4
          PY

      - name: Verify registered screenshot paths and access wording
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const catalog = JSON.parse(fs.readFileSync('plugins.json', 'utf8'));
          for (const component of ['mod_mcp', 'block_mcp']) {
            const entries = catalog.filter(item => item.component === component);
            if (entries.length !== 1) throw Error('Invalid catalog component: ' + component);
            const expected = [1, 2].map(n => ({url: '/marketplace-plugins/screenshots/' + component + '/new-' + n + '.png'}));
            if (JSON.stringify(entries[0].screenshots) !== JSON.stringify(expected)) {
              throw Error('Screenshot paths not registered: ' + component);
            }
          }
          const block = catalog.find(item => item.component === 'block_mcp');
          if (/teachers and students|teachers or teachers and students|give teachers and students a course-level connection/i.test(block.description_html)) {
            throw Error('Incorrect student access statement in description');
          }
          if (!block.description.includes('Students cannot access this block.')) {
            throw Error('Missing block student restriction');
          }
          JS

      - name: Commit only four PNGs and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- screenshots/mod_mcp/new-1.png screenshots/mod_mcp/new-2.png screenshots/block_mcp/new-1.png screenshots/block_mcp/new-2.png
          git rm -- .github/workflows/generate-mcp-screenshots-once.yml
          git diff --cached --check
          git commit -m "feat: publish teacher-only MCP block screenshots"
          for attempt in 1 2 3 4; do
            git fetch origin master
            git rebase origin/master
            if git push origin HEAD:master; then
              echo "Published screenshots without overwriting concurrent changes."
              exit 0
            fi
            echo "Concurrent push, retrying (${attempt}/4)."
          done
          echo "Unable to publish screenshots after four safe retries." >&2
          exit 1
