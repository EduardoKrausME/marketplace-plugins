name: Generate MCP Marketplace icons (one-time)

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/generate-mcp-icons-once.yml"
      - ".github/scripts/generate_mcp_icons.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    name: Render, validate and publish icons
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install image rendering dependencies
        run: python3 -m pip install --quiet --disable-pip-version-check numpy pillow

      - name: Render PNG icons
        run: |
          python3 .github/scripts/generate_mcp_icons.py /tmp/mcp-marketplace-icons
          for component in mod_mcp block_mcp; do
            mkdir -p "icon/$component"
            cp "/tmp/mcp-marketplace-icons/$component/icon.png" "icon/$component/icon.png"
          done

      - name: Validate PNG artwork and alpha
        run: |
          python3 <<'PY'
          from PIL import Image
          from pathlib import Path
          for component in ("mod_mcp", "block_mcp"):
              path = Path("icon") / component / "icon.png"
              image = Image.open(path)
              assert image.format == "PNG", f"{component}: not PNG"
              assert image.size == (1024, 1024), f"{component}: invalid size"
              assert image.mode == "RGBA", f"{component}: missing transparency"
              assert all(image.getpixel(p)[3] == 0 for p in ((0, 0), (1023, 0), (0, 1023), (1023, 1023))), f"{component}: corners not transparent"
              assert image.getpixel((512, 512))[3] > 250, f"{component}: missing blue base"
              assert image.resize((128,128)).size == (128,128)
              print(f"{component}: validated {path.stat().st_size} bytes, transparent corners, 1024x1024")
          PY

      - name: Point catalog records to their own icon paths
        run: |
          node <<'JS'
          const fs = require("node:fs");
          const path = "plugins.json";
          const catalog = JSON.parse(fs.readFileSync(path, "utf8"));
          for (const component of ["mod_mcp", "block_mcp"]) {
            const matches = catalog.filter(item => item.component === component);
            if (matches.length !== 1) throw new Error("Expected exactly one " + component);
            matches[0].iconUrl = "/marketplace-plugins/icon/" + component + "/icon.png";
          }
          fs.writeFileSync(path, JSON.stringify(catalog, null, 2) + "\n");
          JS

      - name: Publish final artwork and remove one-time source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- icon/mod_mcp/icon.png icon/block_mcp/icon.png plugins.json
          git rm -- .github/scripts/generate_mcp_icons.py .github/workflows/generate-mcp-icons-once.yml
          git diff --cached --check
          git commit -m "feat: add dedicated MCP activity and course block icons"
          git push origin HEAD:master
